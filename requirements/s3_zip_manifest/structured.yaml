    test: eu-north-1
    prod: eu-north-1
  description: ''
  secret_ref: false
- name: source_bucket
  values:
    dev: dev-dpl-dstore-sas-eu-north-1-992382551516
    test: ''
    prod: ''
  description: packages arrive here
  secret_ref: false
- name: target_bucket
  values:
    dev: dev-dpl-dstore-sas-eu-north-1-992382551516
    test: ''
    prod: ''
  description: the same bucket as the source
  secret_ref: false
- name: incoming_prefix
  values:
    dev: incoming/
    test: incoming/
    prod: incoming/
  description: ''
