pseudocode_dag: 'DAG s3_zip_manifest: schedule ''0 * * * *'' UTC, catchup=False, max_active_runs=1, dagrun_timeout 5 h (below
  the 6 h SQS visibility timeout).

  start → SEP-0 discover (sqs, queue_url, max_packages 100; drops TestEvents and duplicates) → per package (dynamic task mapping,
  max 8 parallel): SEP-1 (timeout 60 min) → SEP-2 (10 min) → [TRN-1 + TRN-2 in one Airflow task, shared_dir, timeout 120 min,
  worker scratch ≥ 8 GiB] → DLP-1 (60 min) → DLP-2 (10 min, on_failure skip) → outcome → DLP-Z ack (delete delivered/skipped
  handles, release failed) → report (write_uri s3://{target_bucket}/{report_prefix}{run_id}.json; RunFailed when any failed)
  → end.

  Retries: 2 per task, retry_delay 5 min, exponential backoff, only for TransientError and unexpected errors. DataError fails
  the package without a retry; ConfigError fails the run. E-mail on task failure and on RunFailed to alert_email.'
