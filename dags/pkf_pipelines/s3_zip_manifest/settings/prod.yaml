# Settings of pipeline s3_zip_manifest for env prod. Generated by package-factory 0.10.10 from the
# environment details. Secrets only by reference; "create" = the pipeline creates the resource (S5).
alert_email: <REQUIRED>  # data-engineering team e-mail address for alerts
aws_account: <REQUIRED>  # AWS account id (test/prod unknown)
aws_conn_id: aws_default  # Airflow connection (no secrets)
dlq_url: <REQUIRED>  # dead-letter queue of queue_url, maxReceiveCount 3 (Q-TRG-2 proposal)
incoming_prefix: incoming/  # watched prefix (S3 notification filter, suffix .zip)
index_prefix: <REQUIRED>  # delivery index objects {index_prefix}{stem}/{source_sha256}_{source_key_hash}.json (SUG-2); derived value, must not be under incoming_prefix
kms_key_arn: <REQUIRED>  # the bucket's default SSE-KMS key, used for IAM only; derived from the probe
outgoing_prefix: outgoing/  # final delivery prefix in target_bucket; never overwritten
processing_prefix: processing/  # renamed working copy of the original zip
queue_url: create  # SQS queue receiving S3 ObjectCreated events for {incoming_prefix}*.zip
region: eu-north-1  # AWS region (confirmed by the probe)
report_prefix: <REQUIRED>  # run reports s3://{target_bucket}/{report_prefix}{run_id}.json (SUG-3); value derived from the owner's example
source_bucket: <REQUIRED>  # bucket where packages arrive
staging_prefix: staging_test/  # rebuilt zip with manifest.csv before delivery (owner's value kept, see SUG-6)
target_bucket: <REQUIRED>  # delivery bucket; the same bucket as the source
