lock_version: 2
kind: trigger
name: partner_drop_sqs
requirement_sha256: c3d52d811d342a36793bfa8a8372d78be367e215ea4b2b87a3f52c11af7e2bca
plan:
  summary: Reads up to 100 messages per run from the partner-drop SQS queue. It parses each body as an S3 event 
    notification and makes one event per record, with the key URL-decoded. S3 test events are ignored. Only objects in 
    partner-drop-bucket with keys under incoming/ ending in .zip are kept. Each zip stays its own package, named after 
    the file without its extension. A message is deleted only after all its packages are delivered.
  steps:
    - id: receive_sqs
      op: sqs
      title: Read messages from the partner drop queue
      params:
        queue_url: '{queue_url}'
    - id: parse_body
      op: parse_json
      title: Parse each message body as JSON
      params: {}
    - id: unwrap_sns_if_any
      op: unwrap_sns
      title: Unwrap SNS envelope if present (harmless otherwise)
      params: {}
    - id: s3_records_to_events
      op: s3_records
      title: Turn each S3 record into one event, ignoring test events
      params: {}
    - id: keep_incoming_zips
      op: filter
      title: Keep only .zip objects under incoming/ in partner-drop-bucket
      params:
        bucket: partner-drop-bucket
        include:
          - incoming/**/*.zip
    - id: name_package
      op: set_vars
      title: Name each package after the zip file without extension
      params:
        vars:
          package_name: '{event_key_stem}'
  assumptions:
    - The 5-minute cadence is the schedule of the trigger's DAG, set outside these steps; the first step is the single 
      sqs receive.
    - The bucket partner-drop-bucket is fixed in the requirement and no bucket parameter exists, so it is written 
      literally in the filter.
    - Package name is carried in the variable package_name, set from {event_key_stem}, which s3_records already 
      provides.
    - The glob incoming/**/*.zip matches .zip files at any depth under incoming/, including directly in incoming/.
    - SQS defaults are kept (max 100 messages, 1800 s visibility, unmatched messages deleted), so test events and 
      filtered-out messages are deleted.
    - No dedupe step, as the requirement does not ask for it.
  ambiguities: []
  step_tests: {}
