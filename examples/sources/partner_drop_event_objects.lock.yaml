lock_version: 2
kind: source
name: partner_drop_event_objects
requirement_sha256: 165a3a55b35b0d7389b5b2910acf653ad2984b76b95cfb062835920a052db987
plan:
  summary: For each event, the package takes only the object the event names, with no bucket listing. The key must start
    with incoming/. That prefix is removed, so incoming/study1/data.zip becomes study1/data.zip. A key outside incoming/
    fails the package.
  steps:
    - id: take_event_object
      op: from_event
      title: Take the object named by the event, under incoming/
      params:
        root: incoming/
  assumptions:
    - The bucket (partner-drop-bucket) and region (eu-west-1) are component settings, so they are not step parameters.
    - The incoming/ root is fixed in the requirement and the same in every environment, so it is written as a literal.
    - from_event fails the package when a key is not under the root, as the key_outside_root_fails example expects.
    - The requirement does not say what happens if the named object no longer exists, so the default (skip) is kept.
  ambiguities: []
  step_tests: {}
