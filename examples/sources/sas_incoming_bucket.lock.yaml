name: sas_incoming_bucket
requirement_sha256: 37f62c5151deb2082ccc758a5a77637653899241b70b6d1bb3b3a659c5a9b474
plan:
  summary: Lists every object under incoming/ in the SAS S3 bucket at any depth, with paths relative to incoming/. It 
    keeps only files inside a study folder whose names have a "." extension. Folder markers, files directly under 
    incoming/ and extension-less files are dropped silently. Each remaining file becomes its own package.
  steps:
    - id: list_incoming
      op: list
      title: List all objects under incoming/
      params:
        root: incoming/
    - id: keep_study_files_with_extension
      op: select
      title: Skip folder markers, root-level files and files without an extension
      params:
        regex: ^[^/]+/(?:[^/]+/)*[^/]+\.[^/]+$
    - id: one_package_per_file
      op: split
      title: Make each file its own package
      params:
        by: regex
        regex: ^(.+)$
  assumptions:
    - The regex requires at least one folder level (the study folder) before the file name, so files directly under 
      incoming/ are dropped.
    - A file name has an extension when its last path segment contains a '.' with characters on both sides; names like 
      '.hidden' or 'name.' count as having no extension.
    - Folder markers end in '/', so they never match the regex.
    - The study ID is the first path segment and is kept as written, with no changes to case or hyphens.
    - The bucket and region (eu-north-1) come from the fixed component settings, so the plan only sets the incoming/ 
      prefix.
    - The split regex matches the whole path, so every file gets a unique key and its own package.
  ambiguities: []
  step_tests: {}
