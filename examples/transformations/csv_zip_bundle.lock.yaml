lock_version: 2
kind: transformation
name: csv_zip_bundle
requirement_sha256: 260c76d853f63b170e5f10c5987dd4e870c00a0e2568942c021543ebe9e1a70d
plan:
  summary: Keeps only CSV files, refuses the package unless every CSV sits directly in a SITE_ folder with four digits 
    (and at least one exists), and renames the package to <study>_<ds_nodash>. It then bundles the CSVs into 
    <package>.zip with the SITE folders kept, and writes manifest.json beside the zip with the zip's size, md5 and 
    sha256.
  steps:
    - id: keep_csv_only
      op: select
      title: Keep only CSV files
      params:
        include:
          - '**/*.csv'
    - id: check_site_layout
      op: require
      title: Refuse unless there is at least one CSV and every CSV is directly in a SITE_nnnn folder
      params:
        folder_regex: SITE_[0-9]{4}
    - id: name_package
      op: rename_package
      title: Name the package <study>_<ds_nodash>
      params:
        name: '{study}_{ds_nodash}'
    - id: zip_csv_files
      op: zip
      title: Bundle the CSV files into one zip, keeping SITE folders
      params:
        name: '{package}.zip'
    - id: checksum_zip
      op: checksum
      title: Compute md5 and sha256 of the zip
      params:
        algorithms:
          - md5
          - sha256
        include:
          - '*.zip'
    - id: write_manifest
      op: manifest
      title: Write manifest.json listing the zip with size, md5 and sha256
      params:
        fields:
          - path
          - size
          - md5
          - sha256
        include:
          - '*.zip'
  assumptions:
    - CSV means file names ending in lowercase .csv.
    - Non-CSV files (e.g. notes.txt) are silently dropped before the layout check, so only CSV files outside a SITE_nnnn
      folder cause refusal (as in the summary.csv example).
    - CSV files in nested subfolders of a SITE folder are refused because the folder must be exactly SITE_nnnn.
    - The manifest keeps the default package fields (package name, file count, total bytes) in addition to the zip's 
      entry.
    - The zip and manifest.json are both at the package root.
  ambiguities: []
  step_tests: {}
