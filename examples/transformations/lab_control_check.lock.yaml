lock_version: 2
kind: transformation
name: lab_control_check
requirement_sha256: 23ae2860a95d43d5a7cf763ba46d15a11b6f5e6b8202d0f2bd6e0d98cb8dace4
plan:
  summary: Checks each top-level delivery folder has exactly one CONTROL_<n>.txt whose n equals the number of other 
    files in that folder (sub-folders included), and refuses the whole package otherwise. It then removes the control 
    files, moves every remaining file to data/<delivery>/<file name>, computes md5 and sha256, and writes manifest.csv 
    at the root.
  steps:
    - id: check_control_files
      op: custom
      title: Verify each delivery folder has one control file with a matching file count
      params:
        function: check_control_files
      pseudocode: "1. files = pkg.files(); if empty, pkg.fail('empty package').\n2. For each path, split on '/'. If a path
        has no '/' (file at package root), pkg.fail('file outside a delivery folder').\n3. Group paths by first segment (delivery
        folder).\n4. For each folder: controls = paths whose remaining part is exactly one segment (directly in the folder)
        and whose name fully matches CONTROL_(\\d+)\\.txt. Also, any file deeper in the folder whose name matches that pattern
        counts as an extra control file.\n5. If the number of control files != 1, pkg.fail naming the folder (missing or multiple).\n\
        6. n = number in the control file name; others = number of files in the folder minus the control file (sub-folders
        included).\n7. If n != others, pkg.fail naming folder, expected n and actual count.\n8. Make no changes to the package."
    - id: drop_control_files
      op: select
      title: Remove the control files
      params:
        exclude:
          - '*/CONTROL_*.txt'
    - id: move_to_data
      op: move
      title: Move files to data/<delivery folder>/<file name>, dropping sub-folders
      params:
        match: (?P<delivery>[^/]+)/(?:.*/)?(?P<fname>[^/]+)
        to: data/{delivery}/{fname}
    - id: compute_checksums
      op: checksum
      title: Compute md5 and sha256 for every file
      params:
        algorithms:
          - md5
          - sha256
    - id: write_manifest
      op: manifest
      title: Write manifest.csv with path, size, md5, sha256
      params:
        path: manifest.csv
        format: csv
        fields:
          - path
          - size
          - md5
          - sha256
  assumptions:
    - The control file must sit directly in the delivery folder; a CONTROL_*.txt in a sub-folder counts as an extra 
      control file and the package is refused.
    - The count n covers all files in the delivery folder at any depth except the control file itself.
    - A file at the package root (outside any delivery folder) is refused.
    - Two files with the same name in one delivery folder (e.g. in different sub-folders) fail the move because of name 
      conflicts.
    - The manifest does not list itself, because it is written after the checksums.
  ambiguities: []
  step_tests:
    check_control_files:
      - name: two_deliveries_ok
        purpose: Normal path; sub-folder files count; package unchanged
        input:
          files:
            - D001/CONTROL_2.txt
            - D001/a.csv
            - D001/sub/b.csv
            - D002/CONTROL_1.txt
            - D002/c.csv
        params: {}
        expected:
          - D001/CONTROL_2.txt
          - D001/a.csv
          - D001/sub/b.csv
          - D002/CONTROL_1.txt
          - D002/c.csv
        expect_error: false
      - name: zero_other_files
        purpose: CONTROL_0 with no other files is valid
        input:
          files:
            - D001/CONTROL_0.txt
        params: {}
        expected:
          - D001/CONTROL_0.txt
        expect_error: false
      - name: empty_package
        purpose: Empty package refused
        input:
          files: []
        params: {}
        expected:
        expect_error: true
      - name: file_at_root
        purpose: File at package root refused
        input:
          files:
            - readme.txt
            - D001/CONTROL_0.txt
        params: {}
        expected:
        expect_error: true
      - name: missing_control
        purpose: Folder without control file refused
        input:
          files:
            - D001/CONTROL_1.txt
            - D001/a.csv
            - D002/b.csv
        params: {}
        expected:
        expect_error: true
      - name: multiple_controls
        purpose: Two control files in one folder refused
        input:
          files:
            - D001/CONTROL_1.txt
            - D001/CONTROL_2.txt
            - D001/a.csv
        params: {}
        expected:
        expect_error: true
      - name: nested_extra_control
        purpose: Control-named file deeper counts as extra control, so refused
        input:
          files:
            - D001/CONTROL_2.txt
            - D001/a.csv
            - D001/sub/CONTROL_1.txt
        params: {}
        expected:
        expect_error: true
      - name: count_mismatch
        purpose: n differs from actual count refused
        input:
          files:
            - D001/CONTROL_3.txt
            - D001/a.csv
            - D001/b.csv
        params: {}
        expected:
        expect_error: true
