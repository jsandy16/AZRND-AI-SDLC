api_version: pkf/v1
kind: pipeline
name: sas_folder_restructure
description: Move SAS study files from incoming/ into the standard study folder layout, by path rules
owner: data-eng
start_date: 2026-10-01
retries: 2
retry_delay_minutes: 2
tags: [sas, folder-restructure]
requirement: |
  TRIGGER
  - Run on the cron schedule "*/45 * * * *" (no events). Each run processes every file currently under incoming/.

  SOURCE
  - The environment's SAS S3 bucket in region eu-north-1 (set in the source and destination settings).
    Source and destination are the same bucket.
  - List every object under the prefix incoming/, at any depth. Paths are taken relative to incoming/.
  - Skip silently (do not move, do not report): folder markers (keys ending in "/"), files directly under incoming/
    with no study folder (e.g. incoming/readme.txt), and files whose name has no "." extension.
  - Each remaining file is its own package, so a problem with one file does not stop the others.
  - Study ID = the first folder after incoming/, used exactly as written (case and hyphens kept).

  TRANSFORMATION
  - None. Files are never opened, renamed or changed. Only their location changes.

  DESTINATION (the same bucket)
  - Decide the target using the folder path only (the path without the file name). The file name is always kept.
  - Data format from the folder path: adam if it contains /adam/, otherwise sdtm if it contains /sdtm/, otherwise
    raw if it contains raw/ (so restricted_raw/ also counts as raw).
  - For anonymised folders the data format comes from _adam_, _sdtm_, _raw_ or _restricted_raw_ (= raw).
  - "Last folder" = the folder that directly contains the file.
  - Check every rule below. Exactly one rule must match.
    1. CDAP: path contains /data_reuse/ and /cdap_ and a data format.
       - contains /cdap_csr → {study}/extended_primary_use/primary/{format}/{file}
       - else if the last folder contains _ia → take the third "_" part of the last folder (cdap_20210617_ia300 →
         ia300) and write it as ia_ + the rest (ia_300) → {study}/extended_primary_use/interim/{format}/ia_300/{file};
         fewer than 3 parts → error
       - else → second "_" part of the last folder (cdap_20210617 → 20210617)
         → {study}/extended_primary_use/other/{format}/20210617/{file}; fewer than 2 parts → error
    2. IDAP: path contains /data_reuse/ and /idap and a data format → {study}/internal_reuse/{format}/{last folder}/{file}
    3. MED: path contains /data_reuse/ and /med and a data format → {study}/external_reuse/{format}/{last folder}/{file}
    4. ANON: path contains _anon_ and an underscore data format.
       - contains _anon_csr → {study}/anonymised/primary/{format}/{file}
       - else take the last "_" part of the last folder: starts with lowercase ia, case-sensitive (ia500)
         → {study}/anonymised/interim/{format}/ia_500/{file}; otherwise (20220120)
         → {study}/anonymised/other/{format}/20220120/{file}
    5. CDAR: path contains /cdar/ and a data format.
       - reporting level = the folder right after the folder named "ar" (case-insensitive, compared in lowercase)
       - no "ar" folder, or the reporting level is adam, sdtm or raw → error
       - csr → {study}/primary/complete/{format}/{file}
       - starts with ia → remove "ia" and any leading "_", then add "ia_" (ia1 → ia_1, ia_psc → ia_psc)
         → {study}/primary/interim/{format}/{ia_x}/{file}
       - anything else (bdr200) → {study}/primary/other/{format}/bdr200/{file}
    6. OTHERS: path contains /data_reuse/ and a data format, and none of /med, /cdap, /idap, /anon, _anon_
       → {study}/other/{format}/{last folder}/{file}
    7. DEFAULT (pass-through): path has none of /data_reuse/, _anon_, /cdar/ → the same path (incoming/ removed)
  - No rule matches, more than one rule matches, or the target cannot be worked out
    → move the file to error/{path without incoming/}. Never drop a file.

  DELIVERY BEHAVIOUR
  - Move, not copy: copy server-side (files can be larger than 5 GiB), confirm the target exists, then delete the
    source from incoming/.
  - If the copy or the check fails, leave the source in incoming/ so the next run retries it; that file fails.
  - An existing object at the target is overwritten.
  - After a successful move, replace all tags on the target with exactly one tag: ADDITIONAL_TAG = the original path
    without incoming/. A tagging failure is only a warning (the file still counts as moved).
  - Files moved to error/ get no tag change.
  - Report one line per file: source, target, rule or error reason.
  - The run fails only if a copy, check or delete failed. Moving files to error/ does not fail the run.
examples:
  - name: cdar_routes
    listing:
      - incoming/d0000c00004/root/cdar/d000/d0000c00004/ar/csr/adam/dev/data/data_area/a.sas7bdat:10
      - incoming/d0000c00004/root/cdar/d000/d0000c00004/ar/ia100/sdtm/dev/data/data_area/b.sas7bdat:10
      - incoming/d0000c00004/root/cdar/d000/d0000c00004/ar/bdr200/raw/dev/data/data_area/c.sas7bdat:10
    expected_keys:
      - d0000c00004/primary/complete/adam/a.sas7bdat
      - d0000c00004/primary/interim/sdtm/ia_100/b.sas7bdat
      - d0000c00004/primary/other/raw/bdr200/c.sas7bdat
  - name: cdap_routes
    listing:
      - incoming/d0000c00004/data_reuse/d000/d0000c00004/ar/shared/raw/dev/data/cdap_csr/a.sas7bdat:10
      - incoming/d0000c00004/data_reuse/d000/d0000c00004/ar/shared/raw/dev/data/cdap_20210617_ia300/b.sas7bdat:10
      - incoming/d0000c00004/root/data_reuse/d000/d0000c00004/ar/shared/adam/dev/data/cdap_20210617/c.sas7bdat:10
    expected_keys:
      - d0000c00004/extended_primary_use/primary/raw/a.sas7bdat
      - d0000c00004/extended_primary_use/interim/raw/ia_300/b.sas7bdat
      - d0000c00004/extended_primary_use/other/adam/20210617/c.sas7bdat
  - name: idap_med_others
    listing:
      - incoming/d0000c00004/data_reuse/d000/d0000c00004/ar/shared/raw/dev/data/idap_20200922/a.sas7bdat:10
      - incoming/04-3077/root/data_reuse/d525/04-3077/med/adam/prod/data/adae.sas7bdat:10
      - incoming/04-3077/root/data_reuse/d525/04-3077/shared/adam/prod/data/adsl.sas7bdat:10
    expected_keys:
      - d0000c00004/internal_reuse/raw/idap_20200922/a.sas7bdat
      - 04-3077/external_reuse/adam/data/adae.sas7bdat
      - 04-3077/other/adam/data/adsl.sas7bdat
  - name: anon_routes
    listing:
      - incoming/d0000c00004/root/d0000c00004_raw_anon_csr/a.sas7bdat:10
      - incoming/d0000c00004/d0000c00004_raw_anon_20220101_ia500/b.sas7bdat:10
      - incoming/d0000c00004/d0000c00004_raw_anon_20220120/c.sas7bdat:10
    expected_keys:
      - d0000c00004/anonymised/primary/raw/a.sas7bdat
      - d0000c00004/anonymised/interim/raw/ia_500/b.sas7bdat
      - d0000c00004/anonymised/other/raw/20220120/c.sas7bdat
  - name: default_errors_and_skips
    listing:
      - incoming/ABCD-0000-0000/Export_Inventory_usr00001_2024-05-29_08-39-32.pdf:10
      - incoming/04-3077/root/data_reuse/d525/04-3077/shared/prod/data/adae.sas7bdat:10
      - incoming/04-3077/root/data_reuse/cdar/d168/04-3077/ar/csr/adam/prod/data/adae.sas7bdat:10
      - incoming/04-3077/root/cdar/d168/04-3077/adam/prod/data/adae.sas7bdat:10
      - incoming/readme.txt:10
      - incoming/04-3077/root/data_reuse/d525/04-3077/shared/adam/prod/data/no_extension:10
    expected_keys:
      - ABCD-0000-0000/Export_Inventory_usr00001_2024-05-29_08-39-32.pdf
      - error/04-3077/root/data_reuse/d525/04-3077/shared/prod/data/adae.sas7bdat
      - error/04-3077/root/data_reuse/cdar/d168/04-3077/ar/csr/adam/prod/data/adae.sas7bdat
      - error/04-3077/root/cdar/d168/04-3077/adam/prod/data/adae.sas7bdat
connection: sas_folder_restructure_connection
trigger: sas_schedule_45min
transformation:
package_name: '{source}_{ds_nodash}'
