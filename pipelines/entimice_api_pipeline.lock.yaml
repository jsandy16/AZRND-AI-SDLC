# pipelines/entimice_api_pipeline.lock.yaml — the AI's split of the pipeline requirement and its approval.
# Written by `pkf plan pipeline` / `pkf approve-plan pipeline`. Do not edit by hand.
lock_version: 1
pipeline: entimice_api_pipeline
requirement_sha256: 48767c7a3083d7f3ae85b3580499ed988cae1bc7e738c9dca1dd4d8463ebb99d
split:
  summary: "Twice a day (06:00 and 18:00 UTC) the trigger reads the Self-Service control list, validates the API key and keeps
    only the studies due under the refresh rules. It emits one event per due study, with study_id, destination, location,
    id and similar values as variables. The source logs in to the Entimice account chosen by the study's destination, lists
    every file under the study location recursively, and streams each file. There is no transformation, so files keep their
    names and content. The destination picks the bucket from the destination map and builds the key (SAS: incoming/<studyId>/<path>;
    clinicalstudies: <studyId>/ongoing/<path>; other mapped: <studyId>/<path>). It streams each file to S3, checks the size
    afterwards, and sets the Content-Type by extension. It then works out each study's result and writes it back to the Self-Service
    Portal, with consecutive-failure handling."
  components:
    trigger:
      name: selfservice_due_studies
      reuse: false
      spec:
        api_version: pkf/v1
        kind: trigger
        name: selfservice_due_studies
        description: from the trigger part of the pipeline requirement
        schedule: 0 6,18 * * *
        connection:
          region: eu-north-1
        credentials:
          provider: vault
          ref: <REQUIRED>
        params:
          self_service_base_url: <REQUIRED>
          form_id: <REQUIRED>
          force_refresh: 'false'
          max_active_runs: '1'
          catchup: 'false'
        requirement: "Run on cron \"0 6,18 * * *\" (UTC), one run at a time, with no catch-up of missed runs. Run parameter
          force_refresh (default false). When true, completed studies are treated as not completed.\n\nRead the control list:
          GET {SELF_SERVICE_BASE_URL}/api/v1/forms/{FORM_ID}/submissions with headers accept: application/vnd.dpl-selfservice.v1+json
          and X-API-KEY, timeout 60 s. The API key comes from the vault. It must start with \"dpls_\", be at least 20 characters
          and have no spaces, otherwise the run fails at once. The response must be a JSON list of records, each with \"id\"\
          \ (integer) and \"submission_data\" (studyId, location, destination, refreshSchedule, lastTransferStatus, lastTransferAt,
          error, other fields preserved untouched). If the call fails (HTTP error, timeout, network error, non-JSON, not a
          list) the run fails at once and nothing else happens.\n\nDue rules (text trimmed; refreshSchedule and lastTransferStatus
          case-insensitive; dates compared as UTC calendar dates, date part only). Completed = status DONE or COMPLETED.\n\
          - FAILED_INGESTION_STOPPED: never due, also under force_refresh.\n- Once: due when not completed.\n- Daily: due
          when not completed, or completed and lastTransferAt is on an earlier calendar day than today.\n- Weekly: due when
          not completed, or completed and lastTransferAt is 7 or more calendar days ago.\n- Monthly: due when not completed,
          or completed and lastTransferAt is 30 or more calendar days ago.\n- Completed Daily/Weekly/Monthly with blank or
          unreadable lastTransferAt: due.\n- Any other or blank refreshSchedule: not due.\n- force_refresh=true: every Once/Daily/Weekly/Monthly
          study not in FAILED_INGESTION_STOPPED is due.\n\nAccepted lastTransferAt formats: \"2025-02-18 07:48 AM\", \"2026-09-30
          17:02\", \"2026-10-01\", \"4/21/2022 11:36 PM\", \"03/03/2026 00:31\", \"4/21/2022 11:36PM\".\n\nEmit one event
          (one package) per due study, carrying the whole record. Set the variables study_id (submission_data.studyId trimmed,
          stray tabs removed), destination, location and submission id from the record. Not-due studies are counted per reason
          and not updated. When no study is due the run succeeds without further work. After the run, write back each due
          study's result with PUT {SELF_SERVICE_BASE_URL}/api/v1/forms/{FORM_ID}/submissions/{id} (same headers plus Content-Type:
          application/json, timeout 60 s). The body is {\"submission_data\": original with only modifiedAt, lastTransferAt
          (now when DONE, else unchanged), lastTransferStatus, error, modifiedByPrid and modifiedByFullName changed}. Dates
          are \"%Y-%m-%d %I:%M %p\" in UTC. A failed write-back is logged only. A record without id is not updated.\n"
        examples:
          - name: daily_not_completed_due
            messages: []
            conf:
            params:
              force_refresh: 'false'
            expected_events:
              - keys: []
                vars:
                  study_id: S100
                  destination: SAS
            expect_error: false
          - name: completed_today_daily_not_due
            messages: []
            conf:
            params:
              force_refresh: 'false'
            expected_events: []
            expect_error: false
          - name: stopped_never_due_even_forced
            messages: []
            conf:
            params:
              force_refresh: 'true'
            expected_events: []
            expect_error: false
          - name: control_list_fails
            messages: []
            conf:
            params:
              force_refresh: 'false'
            expected_events: []
            expect_error: true
    source:
      name: entimice
      reuse: false
      spec:
        api_version: pkf/v1
        kind: source
        name: entimice
        description: from the source part of the pipeline requirement
        type: entimice
        connection:
          base_url: https://<REQUIRED>
          account_by: '{destination}'
          accounts:
            <REQUIRED>: <REQUIRED>
        credentials:
          provider: vault
          ref: <REQUIRED>
        params:
          verify_ssl: 'true'
          max_depth: '20'
        requirement: "Custom source reading the Entimice REST API (base URL per environment, SSL verification on by default).
          Each event is one due study with variables study_id, destination, location and submission id; one package per event.\n\
          \nLogin: POST {base}/sessions with accept: text/plain, timeout 60 s. HTTP 200 gives the session id (body trimmed,
          surrounding quotes removed). Anything else or an empty body is a login failure. The account per study is chosen
          by the destination through a per-environment map (case-insensitive, trimmed). A destination not in the map, or no
          map, uses the default account. Credentials come from the vault, are never logged, and the session id is never logged.
          Log in to every account that has at least one due study before any study is processed. If any login fails the run
          fails and no study is processed. Delete every session at the end of the run, also on failure: DELETE {base}/sessions/{id}
          (accept: */*, timeout 60 s). 200/204 is deleted; a failed delete is only a warning.\n\nListing per study: start
          at the study's location (trimmed). Recursively GET {base}/system/children?parent=<path>&filter=webservice::<id>
          with accept: application/json and Session-ID, timeout 60 s. HTTP 200 gives a JSON list of nodes. For each node use
          contentHolders[0].contentProperties \"path\" (trimmed) and \"isDirectory\" (case-insensitive true/false). Directories
          are listed again; anything else is a file. Nodes without contentHolders or with an empty path are skipped silently.
          Folders deeper than 20 levels below the location are skipped with a warning. Any failing listing call (non-200,
          timeout, network error) fails the whole study with that error and none of its files are copied. A file is identified
          by its full Entimice path from contentProperties.path. A missing location fails the study with \"Missing location
          in submission_data | Reason: Other issue\". If no files are found the study fails with \"Empty data from the Entimice
          API. | Reason: No data available issue\".\n\nDownload per file: GET {base}/system?type=file&path=<file path> with
          accept: */* and Session-ID. It is streamed, never fully in memory, with a timeout of 120 s between chunks, and gzip
          content-encoding is decoded. A non-200 response fails that file. A declared Content-Length of 0 fails that file
          with \"Entimice returned empty content for file | path=<path>\". Keep the declared Content-Length for the size check
          after upload. One failing file never stops the other files or studies.\n"
        examples:
          - name: nested_listing
            event:
              objects: []
              vars:
                study_id: S100
                destination: SAS
                location: /root/cdar/d1
            listing:
              - root/cdar/d1/data/a.sas7bdat:10
              - root/cdar/d1/doc/r.pdf:20
            contents: {}
            params: {}
            expected_packages:
              -   - root/cdar/d1/data/a.sas7bdat
                  - root/cdar/d1/doc/r.pdf
            expect_error: false
          - name: empty_location_fails
            event:
              objects: []
              vars:
                study_id: S100
                destination: SAS
                location: /root/empty
            listing: []
            contents: {}
            params: {}
            expected_packages: []
            expect_error: true
    destination:
      name: s3_by_destination
      reuse: false
      spec:
        api_version: pkf/v1
        kind: destination
        name: s3_by_destination
        description: from the destination part of the pipeline requirement
        type: s3
        connection:
          bucket_by: '{destination}'
          bucket_map:
            SAS: <REQUIRED>
            clinicalstudies: <REQUIRED>
          region: eu-north-1
        credentials:
          provider: none
        delivery:
          mode: stream
          if_exists: overwrite
          content_types:
            .sas7bdat: application/octet-stream
            .pdf: application/pdf
            .xml: application/xml
            .xls: application/vnd.ms-excel
            .xlsx: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
            .csv: text/csv
            .txt: text/plain
        params:
          part_size_mib: '16'
          max_parallel_parts: '8'
        requirement: "Deliver to S3 in region eu-north-1. The bucket is DESTINATION_BUCKET_MAP[destination] (map keys \"SAS\"\
          \ and \"clinicalstudies\", bucket names set per environment), using the destination variable trimmed, with an exact
          case-sensitive match. <studyId> is the study_id variable (trimmed, stray tabs removed). <path> is the Entimice file
          path with surrounding spaces and leading \"/\" removed. Keys: destination SAS gives incoming/<studyId>/<path>. Destination
          clinicalstudies gives <studyId>/ongoing/<path>. Any other mapped destination gives <studyId>/<path>. Example: study
          S100, SAS, file /root/a/data/x.sas7bdat gives incoming/S100/root/a/data/x.sas7bdat. Content-Type by extension: .sas7bdat
          application/octet-stream, .pdf application/pdf, .xml application/xml, .xls application/vnd.ms-excel, .xlsx application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,
          .csv text/csv, .txt text/plain, anything else application/octet-stream.\n\nBlank or unknown destination, or blank
          studyId: the study FAILED and no file is copied.\n\nDelivery: copy (source untouched). Each file is streamed from
          the source as a multipart upload with 16 MiB parts and up to 8 parallel parts, for files up to at least 160 GiB.
          Existing objects at the same key are overwritten. No tags. Encryption is the bucket default. After each upload HEAD
          the object. If Entimice declared a Content-Length and the sizes differ, the file fails with \"S3 upload size mismatch
          | key=<key> | source=<n> | target=<m>\". One failing file never stops the other files of the study, and one failing
          study never stops the other studies.\n\nStudy result, first applicable rule wins:\n1. Listing failed: FAILED, \"\
          <listing error> | Reason: <reason>\".\n2. No files found: FAILED, \"Empty data from the Entimice API. | Reason:
          No data available issue\".\n3. Destination blank: FAILED, \"Destination is blank — enter the destination in the
          Self-Service Portal. | Reason: Configuration issue\". Destination not in map: \"Unknown destination '<value>' —
          cannot resolve S3 bucket. | Reason: Configuration issue\". StudyId blank: \"Missing studyId in submission_data —
          cannot build S3 key. | Reason: Configuration issue\". No file copied.\n4. At least one file failed: FAILED, \"S3
          upload failed for <n> file(s): <path> | Reason: <reason>, <path> | Reason: <reason>, ...\" (one entry per failed
          file).\n5. No file copied: FAILED, \"Files were found in Entimice but none was uploaded to S3. | Reason: Other issue\"\
          .\n6. Otherwise DONE, error \"\".\nMissing location: FAILED, \"Missing location in submission_data | Reason: Other
          issue\".\n\nReason from the error text (case-insensitive), first match wins: 403/forbidden/denied/unauthor = Access
          issue; 404/does not exist/not found/could not resolve = File missing issue; empty content/corrupt/unreadable = File
          corrupt issue; empty data/no data = No data available issue; timed out/timeout = Timeout issue; destination/studyid
          = Configuration issue; else Other issue.\n\nConsecutive-failure limit (state only in the record's error text): Once
          10, Daily 15, Weekly and Monthly none. Previous count = the number in \"Consecutive failed runs: <n>\" only when
          the stored lastTransferStatus is FAILED, else 0. It is also 0 when the error text contains \"so disabling the trigger
          for this study\" or the stored count already reached the limit. On a failure of a study with a limit: count = previous
          + 1 and error = \"<error> | Consecutive failed runs: <count> of <limit>\". When the count reaches the limit, status
          = FAILED_INGESTION_STOPPED and \" | Study is failing for last <limit> runs so disabling the trigger for this study\"\
          \ is appended.\n\nReport one line per due study: submission id, studyId, destination, files found, files copied,
          status, error (first 300 chars). Add totals per status and the number of studies not due per reason. The run fails
          only when the control-list call fails, an Entimice login fails, or an unexpected error occurs outside a single study.
          Otherwise it succeeds even if studies end FAILED.\n"
        examples:
          - name: sas
            files:
              - root/a/data/x.sas7bdat
            vars:
              package: S100
              study_id: S100
              destination: SAS
            params: {}
            expected_keys:
              - incoming/S100/root/a/data/x.sas7bdat
            expect_error: false
          - name: clinicalstudies
            files:
              - root/d2/data/b.csv
            vars:
              package: S200
              study_id: S200
              destination: clinicalstudies
            params: {}
            expected_keys:
              - S200/ongoing/root/d2/data/b.csv
            expect_error: false
          - name: other_mapped
            files:
              - root/x/c.xml
            vars:
              package: S300
              study_id: S300
              destination: other
            params: {}
            expected_keys:
              - S300/root/x/c.xml
            expect_error: false
          - name: unknown_destination
            files:
              - root/y/d.txt
            vars:
              package: S400
              study_id: S400
              destination: ''
            params: {}
            expected_keys: []
            expect_error: true
  errors: []
  package_name: '{study_id}'
  pipeline_examples:
    - name: sas_study_copied
      messages: []
      conf:
      listing:
        - root/cdar/d1/data/a.sas7bdat:10
        - root/cdar/d1/doc/r.pdf:20
      params: {}
      expected_keys:
        - incoming/S100/root/cdar/d1/data/a.sas7bdat
        - incoming/S100/root/cdar/d1/doc/r.pdf
      expect_error: false
    - name: clinicalstudies_study_copied
      messages: []
      conf:
      listing:
        - root/cdar/d2/data/b.csv:5
      params: {}
      expected_keys:
        - S200/ongoing/root/cdar/d2/data/b.csv
      expect_error: false
    - name: other_mapped_destination
      messages: []
      conf:
      listing:
        - root/x/c.xml:7
      params: {}
      expected_keys:
        - S300/root/x/c.xml
      expect_error: false
    - name: unknown_destination_nothing_copied
      messages: []
      conf:
      listing:
        - root/y/d.txt:3
      params: {}
      expected_keys: []
      expect_error: false
    - name: control_list_fails
      messages: []
      conf:
      listing: []
      params: {}
      expected_keys: []
      expect_error: true
  assumptions:
    - Self-Service form values (base URL, form id), Entimice base URL, account map, vault references and bucket names 
      are per-environment and left as <REQUIRED>.
    - Numeric and boolean params are written as strings because the framework requires string params.
    - The trigger puts study_id, destination, location and the submission id on each event as variables. The source and 
      destination use them.
    - The Self-Service API key and Entimice credentials come from the vault, referenced only by the credentials ref.
    - Write-back to the Self-Service Portal and the study result and failure-count logic are part of the delivery step, 
      so they sit in the destination requirement.
    - The trigger's catchup and max_active_runs settings are expressed as params.
  ambiguities: []
  to_fill_in:
    - destination.connection.bucket_map.SAS
    - destination.connection.bucket_map.clinicalstudies
    - source.connection.accounts.<REQUIRED>
    - source.connection.base_url
    - source.credentials.ref
    - trigger.credentials.ref
    - trigger.params.form_id
    - trigger.params.self_service_base_url
owned: []
