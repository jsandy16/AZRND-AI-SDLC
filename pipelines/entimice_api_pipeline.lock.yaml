# pipelines/entimice_api_pipeline.lock.yaml — the AI's split of the pipeline requirement and its approval.
# Written by `pkf plan pipeline` / `pkf approve-plan pipeline`. Do not edit by hand.
lock_version: 1
pipeline: entimice_api_pipeline
requirement_sha256: 9ffcd44de3802cf98870793209b9da833e6d20fa70d648b2b7de532bd81f104b
split:
  summary: "Twice a day (06:00 and 18:00 UTC) a run reads the Self-Service control list, checks the API key format and keeps
    only the studies that are due under the refresh rules. Each due study becomes one event and one package. The source logs
    in to the Entimice account chosen by the study's destination, lists the study's location recursively and streams each
    file. Nothing is transformed. The destination picks the bucket from the destination map and builds the key (SAS: incoming/<studyId>/<path>;
    clinicalstudies: <studyId>/ongoing/<path>; other mapped: <studyId>/<path>). It streams a multipart upload with a size
    check and sets the content type by extension. Study results, including the consecutive-failure counter, are written back
    to the Self-Service records. A blank or unknown destination or a blank studyId fails the study without copying anything."
  components:
    trigger:
      name: selfservice_study_schedule
      reuse: false
      spec:
        api_version: pkf/v1
        kind: trigger
        name: selfservice_study_schedule
        description: from the trigger part of the pipeline requirement
        schedule: 0 6,18 * * *
        connection:
          region: <REQUIRED>
        params:
          self_service_base_url: <REQUIRED>
          form_id: <REQUIRED>
          force_refresh: 'false'
        credentials:
          provider: vault
          ref: <REQUIRED>
        requirement: "Runs on the cron schedule \"0 6,18 * * *\" (UTC): one event per run, no message content. Only one run
          at a time; missed runs are not caught up. Each run processes every study due when the run starts. Run parameter
          force_refresh (default false): when true, completed studies are treated as not completed. Read the control list
          with GET {self_service_base_url}/api/v1/forms/{form_id}/submissions, headers accept: application/vnd.dpl-selfservice.v1+json
          and X-API-KEY (the api_key field of the vault secret), timeout 60 s. The API key must start with \"dpls_\", be at
          least 20 characters and have no spaces, otherwise the run fails at once. The response must be a JSON list of records,
          each with \"id\" (integer) and \"submission_data\" (studyId, location, destination, refreshSchedule, lastTransferStatus,
          lastTransferAt, error, plus other fields preserved untouched). If the call fails (HTTP error, timeout, network error,
          non-JSON, not a list) the run fails at once; nothing is read from Entimice and nothing is written anywhere. Due
          rules (text trimmed; refreshSchedule and lastTransferStatus case-insensitive; dates compared as UTC calendar dates,
          date part only; completed = status DONE or COMPLETED): status FAILED_INGESTION_STOPPED is never due (skipped silently,
          not updated), also under force_refresh. Once: due when not completed. Daily: due when not completed, or completed
          and lastTransferAt is on an earlier calendar day than today. Weekly: due when not completed, or completed and lastTransferAt
          is 7 or more calendar days ago. Monthly: same with 30 or more days. Completed Daily/Weekly/Monthly with blank or
          unreadable lastTransferAt: due. Any other or blank refreshSchedule: not due. force_refresh=true: every Once/Daily/Weekly/Monthly
          study not in FAILED_INGESTION_STOPPED is due. Accepted lastTransferAt formats: \"2025-02-18 07:48 AM\", \"2026-09-30
          17:02\", \"2026-10-01\", \"4/21/2022 11:36 PM\", \"03/03/2026 00:31\", \"4/21/2022 11:36PM\". One event (one package)
          per due study, carrying the record id and the submission_data fields as variables (study_id from studyId, location,
          destination, and the schedule/status fields); the record is written back after the run with the study result (DONE
          / FAILED / FAILED_INGESTION_STOPPED). Not-due studies are counted per reason (not updated). When no study is due
          the run succeeds without touching Entimice or S3.\n"
        examples:
          - name: due_sas_study
            messages: []
            conf:
            params: {}
            expected_events:
              - keys: []
                vars:
                  study_id: S100
                  destination: SAS
                  location: /root/cdar/d1
            expect_error: false
          - name: stopped_study_not_due
            messages: []
            conf:
            params: {}
            expected_events: []
            expect_error: false
          - name: control_list_fails
            messages: []
            conf:
            params: {}
            expected_events: []
            expect_error: true
    source:
      name: entimice
      reuse: false
      spec:
        api_version: pkf/v1
        kind: source
        name: entimice
        description: from the source part of the pipeline requirement
        type: entimice
        connection:
          base_url: https://<REQUIRED>
          account_by: '{destination}'
          accounts: {}
        credentials:
          provider: vault
          ref: <REQUIRED>
        params: {}
        requirement: "Entimice REST API (base URL per environment, SSL verification on by default) with session login, recursive
          JSON listing and streamed download. Login: POST {base}/sessions with accept: text/plain, timeout 60 s; HTTP 200
          gives the session id (body trimmed, surrounding quotes removed); anything else or an empty body is a login failure.
          The account per study is chosen by the study's destination via a per-environment map (case-insensitive, trimmed);
          a destination that is mapped for buckets but not in the account map uses the default account; a blank or unknown
          destination (not in the destination bucket map) does not get a default-account fallback and the study is not listed.
          Log in to every account with at least one due study before any study is processed; if any login fails the run fails
          and no study is processed. Every session is deleted at the end of the run, also on failure: DELETE {base}/sessions/{id}
          (accept: */*, timeout 60 s); 200/204 is deleted, a failed delete is only a warning. Listing per due study: start
          at the study's location (trimmed; missing location fails the study with \"Missing location in submission_data |
          Reason: Other issue\"), recursively GET {base}/system/children?parent=<path>&filter=webservice::<id> with accept:
          application/json and Session-ID, timeout 60 s; HTTP 200 gives a JSON list of nodes. For each node use contentHolders[0].contentProperties
          \"path\" (trimmed) and \"isDirectory\" (case-insensitive true/false). Directories are listed again; anything else
          is a file. Nodes without contentHolders or with an empty path are skipped silently. Folders deeper than 20 levels
          below the location are skipped with a warning. Any failing listing call (non-200, timeout, network error) fails
          the whole study with that error and none of its files are copied. A file is identified by its full Entimice path
          from contentProperties.path. One package per study. Download per file: GET {base}/system?type=file&path=<file path>
          with accept: */* and Session-ID; streamed (never fully in memory); timeout 120 s between chunks; gzip content-encoding
          decoded. Non-200 fails that file; a declared Content-Length of 0 fails that file with \"Entimice returned empty
          content for file | path=<path>\". Passwords and session ids are never logged.\n"
        examples:
          - name: lists_nested_files
            event:
              objects: []
              vars:
                study_id: S100
                destination: SAS
                location: root/cdar/d1
            listing:
              - root/cdar/d1/data/a.sas7bdat:10
              - root/cdar/d1/doc/r.pdf:20
            contents: {}
            params: {}
            expected_packages:
              -   - root/cdar/d1/data/a.sas7bdat
                  - root/cdar/d1/doc/r.pdf
            expect_error: false
          - name: empty_listing_no_files
            event:
              objects: []
              vars:
                study_id: S100
                destination: SAS
                location: root/cdar/d1
            listing: []
            contents: {}
            params: {}
            expected_packages:
              - []
            expect_error: false
    destination:
      name: study_s3_bucket_map
      reuse: false
      spec:
        api_version: pkf/v1
        kind: destination
        name: study_s3_bucket_map
        description: from the destination part of the pipeline requirement
        type: s3
        connection:
          bucket_by: '{destination}'
          bucket_map:
            SAS: <REQUIRED>
            clinicalstudies: <REQUIRED>
          region: eu-north-1
        credentials:
          provider: none
        delivery:
          mode: stream
          if_exists: overwrite
          content_types:
            .sas7bdat: application/octet-stream
            .pdf: application/pdf
            .xml: application/xml
            .xls: application/vnd.ms-excel
            .xlsx: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
            .csv: text/csv
            .txt: text/plain
        params: {}
        requirement: "S3 in region eu-north-1. Bucket = bucket map[destination], exact (case-sensitive) match after trimming;
          map keys \"SAS\" and \"clinicalstudies\" (other destinations may be mapped per environment); bucket names set per
          environment. <studyId> = study id trimmed (stray tabs removed); <path> = Entimice file path with surrounding spaces
          and leading \"/\" removed. Key: destination SAS: incoming/<studyId>/<path>; destination clinicalstudies: <studyId>/ongoing/<path>;
          any other mapped destination: <studyId>/<path>. Example: study S100, SAS, file /root/a/data/x.sas7bdat gives incoming/S100/root/a/data/x.sas7bdat.
          Content-Type by extension: .sas7bdat application/octet-stream, .pdf application/pdf, .xml application/xml, .xls
          application/vnd.ms-excel, .xlsx application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, .csv text/csv,
          .txt text/plain, anything else application/octet-stream. Blank or unknown destination (not in the map) or blank
          studyId: the study FAILED and no file is copied; messages: \"Destination is blank — enter the destination in the
          Self-Service Portal. | Reason: Configuration issue\", \"Unknown destination '<value>' — cannot resolve S3 bucket.
          | Reason: Configuration issue\", \"Missing studyId in submission_data — cannot build S3 key. | Reason: Configuration
          issue\". Delivery: copy (source untouched), each file streamed from the source as multipart upload, 16 MiB parts,
          up to 8 parallel parts, files up to at least 160 GiB. Existing objects at the same key are overwritten. No tags.
          Encryption = bucket default. After each upload HEAD the object; if Entimice declared a Content-Length and sizes
          differ, the file fails with \"S3 upload size mismatch | key=<key> | source=<n> | target=<m>\". One failing file
          never stops the other files of the study; one failing study never stops other studies. Study result, first rule
          wins: 1. listing failed: FAILED \"<listing error> | Reason: <reason>\"; 2. no files found: FAILED \"Empty data from
          the Entimice API. | Reason: No data available issue\"; 3. configuration problems above; 4. at least one file failed:
          FAILED \"S3 upload failed for <n> file(s): <path> | Reason: <reason>, <path> | Reason: <reason>, ...\"; 5. no file
          copied: FAILED \"Files were found in Entimice but none was uploaded to S3. | Reason: Other issue\"; 6. otherwise
          DONE with error \"\". Reason from error text (case-insensitive), first match wins: 403/forbidden/denied/unauthor
          = Access issue; 404/does not exist/not found/could not resolve = File missing issue; empty content/corrupt/unreadable
          = File corrupt issue; empty data/no data = No data available issue; timed out/timeout = Timeout issue; destination/studyid
          = Configuration issue; else Other issue. Consecutive-failure limit (state only in the record's error text): Once
          10, Daily 15, Weekly and Monthly none. Previous count = number in \"Consecutive failed runs: <n>\" only when stored
          lastTransferStatus is FAILED, else 0; also 0 when the error text contains \"so disabling the trigger for this study\"\
          \ or the stored count already reached the limit (such a study is stopped). On failure of a study with a limit: count
          = previous + 1, error = \"<error> | Consecutive failed runs: <count> of <limit>\"; when count reaches the limit
          status = FAILED_INGESTION_STOPPED and \" | Study is failing for last <limit> runs so disabling the trigger for this
          study\" is appended. Write-back after all studies are processed, one call per due study: PUT {SELF_SERVICE_BASE_URL}/api/v1/forms/{FORM_ID}/submissions/{id}
          with accept: application/vnd.dpl-selfservice.v1+json, X-API-KEY, Content-Type: application/json, timeout 60 s; body
          {\"submission_data\": original with only these changed}: modifiedAt = now; lastTransferAt = now when DONE, else
          unchanged; lastTransferStatus = DONE | FAILED | FAILED_INGESTION_STOPPED; error = error text (\"\" when DONE); modifiedByPrid
          = SERVICE_USER_PRID; modifiedByFullName = SERVICE_USER_NAME. Dates \"%Y-%m-%d %I:%M %p\" in UTC, e.g. \"2026-10-20
          06:02 AM\". A failed write-back is logged, does not stop others and does not fail the run; a record without id is
          not updated (logged). The run fails only when the control-list call fails, an Entimice login fails, or an unexpected
          error occurs outside a single study; otherwise it succeeds even if studies end FAILED. Report one line per due study:
          submission id, studyId, destination, files found, files copied, status, error (first 300 chars); totals per status
          and number of studies not due per reason. Secrets (API key, passwords) never logged.\n"
        examples:
          - name: sas_key
            files:
              - root/cdar/d1/data/a.sas7bdat
              - root/cdar/d1/doc/r.pdf
            vars:
              package: S100
              study_id: S100
              destination: SAS
            params: {}
            expected_keys:
              - incoming/S100/root/cdar/d1/data/a.sas7bdat
              - incoming/S100/root/cdar/d1/doc/r.pdf
            expect_error: false
          - name: clinicalstudies_key
            files:
              - root/cdar/d2/data/b.csv
            vars:
              package: S200
              study_id: S200
              destination: clinicalstudies
            params: {}
            expected_keys:
              - S200/ongoing/root/cdar/d2/data/b.csv
            expect_error: false
          - name: other_mapped_key
            files:
              - root/x/c.xml
            vars:
              package: S300
              study_id: S300
              destination: OTHER
            params: {}
            expected_keys:
              - S300/root/x/c.xml
            expect_error: false
          - name: unknown_destination_refused
            files:
              - root/y/d.txt
            vars:
              package: S400
              study_id: S400
              destination: nowhere
            params: {}
            expected_keys: []
            expect_error: true
  errors: []
  package_name: '{study_id}'
  pipeline_examples:
    - name: sas_study_copied
      messages: []
      conf:
      listing:
        - root/cdar/d1/data/a.sas7bdat:10
        - root/cdar/d1/doc/r.pdf:20
      params: {}
      expected_keys:
        - incoming/S100/root/cdar/d1/data/a.sas7bdat
        - incoming/S100/root/cdar/d1/doc/r.pdf
      expect_error: false
    - name: clinicalstudies_study_copied
      messages: []
      conf:
      listing:
        - root/cdar/d2/data/b.csv:5
      params: {}
      expected_keys:
        - S200/ongoing/root/cdar/d2/data/b.csv
      expect_error: false
    - name: other_mapped_destination
      messages: []
      conf:
      listing:
        - root/x/c.xml:7
      params: {}
      expected_keys:
        - S300/root/x/c.xml
      expect_error: false
    - name: unknown_destination_nothing_copied
      messages: []
      conf:
      listing:
        - root/y/d.txt:3
      params: {}
      expected_keys: []
      expect_error: false
    - name: control_list_fails
      messages: []
      conf:
      listing: []
      params: {}
      expected_keys: []
      expect_error: true
  assumptions:
    - force_refresh is passed as a string parameter ("false" default) and interpreted as boolean by the trigger.
    - Each due study is one event; study_id comes from submission_data.studyId and is used as package name (blank study 
      id leads to a failed study with a Configuration issue).
    - A study whose stored consecutive-failure count already reached the limit restarts at 0 (as stated in the 
      requirement), per the owner's answer 'stop it' this record is treated as stopped and not counted further.
    - "A study with a destination not in the destination bucket map gets no default-account fallback: it is not listed, fails
      with 'Unknown destination' and nothing is copied; the default account is used only for mapped destinations missing from
      the account map."
    - Account map and bucket map values, hosts, secret references and the trigger region are per environment and left as
      <REQUIRED>.
    - Results are written back to Self-Service by the trigger/framework write-back, described in the destination 
      requirement.
  ambiguities: []
  to_fill_in:
    - destination.connection.bucket_map.SAS
    - destination.connection.bucket_map.clinicalstudies
    - source.connection.base_url
    - source.credentials.ref
    - trigger.connection.region
    - trigger.credentials.ref
    - trigger.params.form_id
    - trigger.params.self_service_base_url
